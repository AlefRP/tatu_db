[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tatu-db"
dynamic = ["version"]
description = "Um banco de dados relacional minúsculo, feito do zero em Python, para aprender."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AlefRP" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["banco de dados", "database", "sql", "educacional", "relacional", "sgbd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/AlefRP/tatu_db"
Documentation = "https://github.com/AlefRP/tatu_db/tree/main/docs"
Issues = "https://github.com/AlefRP/tatu_db/issues"
Changelog = "https://github.com/AlefRP/tatu_db/blob/main/CHANGELOG.md"

[project.scripts]
tatu = "tatu.repl:main"

[tool.setuptools]
packages = ["tatu"]

[tool.setuptools.dynamic]
version = { attr = "tatu.__version__" }  # a versão mora só em tatu/__init__.py

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".claude/skills/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# O código é feito para ser lido por quem está aprendendo: algumas regras
# trocariam clareza por idiomas mais avançados.
ignore = [
    "B905",    # zip(strict=...): os tamanhos já são conferidos antes
    "SIM102",  # ifs aninhados às vezes explicam melhor o passo a passo
    "SIM105",  # try/except/pass é mais fácil de entender que contextlib.suppress
    "SIM108",  # idem para if/else em vez de ternário
    "SIM905",  # a lista de palavras-chave fica mais legível como texto
]

[tool.ruff.lint.per-file-ignores]
"tatu/__init__.py" = ["E402"]   # __version__ precisa vir antes dos imports
"examples/*.py" = ["E402"]      # o exemplo ajusta o sys.path antes de importar
