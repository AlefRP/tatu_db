<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="titulo">
  <title id="titulo">Tatu DB — um banco de dados relacional feito do zero, em Python, para aprender</title>
  <defs>
