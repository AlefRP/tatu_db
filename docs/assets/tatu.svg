<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="340" height="200" role="img" aria-labelledby="titulo">
  <title id="titulo">O tatu, mascote do Tatu DB</title>
  <defs>
    <linearGradient id="casco-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B57A"/>
      <stop offset="1" stop-color="#B8783F"/>
    </linearGradient>
    <pattern id="escamas" width="12" height="10" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#7A4A22" opacity=".35"/>
      <circle cx="9" cy="8" r="2.2" fill="#7A4A22" opacity=".35"/>
    </pattern>
    <clipPath id="clip-casco">
      <path d="M56 152 C52 92 98 40 166 38 C236 36 282 88 282 152 Q169 168 56 152 Z"/>
    </clipPath>
  </defs>

  <g id="tatu">
    <!-- sombra -->
    <ellipse cx="170" cy="188" rx="140" ry="8" fill="#3B2412" opacity=".15"/>

    <!-- rabo -->
    <path d="M66 140 C46 148 26 164 10 184 C30 177 50 167 72 158 Z" fill="#B57A43" stroke="#5A3519" stroke-width="3" stroke-linejoin="round"/>
    <path d="M50 150 L55 164 M36 161 L42 172 M24 171 L29 179" stroke="#5A3519" stroke-width="2" opacity=".55" stroke-linecap="round"/>

    <!-- patas de trás (escondidas) e da frente -->
    <rect x="116" y="146" width="24" height="38" rx="10" fill="#7A4A22" stroke="#5A3519" stroke-width="3"/>
    <rect x="206" y="146" width="24" height="38" rx="10" fill="#7A4A22" stroke="#5A3519" stroke-width="3"/>
    <rect x="82" y="140" width="26" height="44" rx="11" fill="#8C5A2B" stroke="#5A3519" stroke-width="3"/>
    <rect x="238" y="140" width="26" height="44" rx="11" fill="#8C5A2B" stroke="#5A3519" stroke-width="3"/>
    <path d="M86 184 l-3 5 M93 185 l-1 5 M100 184 l1 5 M244 184 l-1 5 M251 185 l1 5 M258 184 l2 5" stroke="#F3E3C8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- casco -->
    <path d="M56 152 C52 92 98 40 166 38 C236 36 282 88 282 152 Q169 168 56 152 Z" fill="url(#casco-grad)"/>
    <g clip-path="url(#clip-casco)">
      <rect x="40" y="20" width="90" height="150" fill="url(#escamas)"/>
      <rect x="212" y="20" width="80" height="150" fill="url(#escamas)"/>
      <!-- as faixas que dão nome ao tatu-bola, tatu-peba... -->
      <path d="M142 20 Q147 95 142 175 L156 175 Q161 95 156 20 Z" fill="#000" opacity=".08"/>
      <path d="M170 20 Q175 95 170 175 L184 175 Q189 95 184 20 Z" fill="#000" opacity=".08"/>
      <path d="M198 20 Q203 95 198 175 L212 175 Q217 95 212 20 Z" fill="#000" opacity=".08"/>
      <path d="M128 20 Q133 95 128 175 M142 20 Q147 95 142 175 M156 20 Q161 95 156 175 M170 20 Q175 95 170 175 M184 20 Q189 95 184 175 M198 20 Q203 95 198 175 M212 20 Q217 95 212 175" fill="none" stroke="#6E4220" stroke-width="3"/>
      <path d="M56 150 Q169 166 282 150" fill="none" stroke="#7A4A22" stroke-width="10" opacity=".35"/>
    </g>
    <path d="M90 94 C102 68 126 54 150 49" fill="none" stroke="#FFF3DE" stroke-width="6" stroke-linecap="round" opacity=".6"/>
    <path d="M56 152 C52 92 98 40 166 38 C236 36 282 88 282 152 Q169 168 56 152 Z" fill="none" stroke="#5A3519" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- orelha -->
    <path d="M262 104 C255 86 259 70 270 65 C279 76 279 93 273 108 Z" fill="#8C5A2B" stroke="#5A3519" stroke-width="3" stroke-linejoin="round"/>
    <path d="M266 99 C262 87 265 77 270 73 C275 82 274 92 271 101 Z" fill="#D9A57A"/>

    <!-- cabeça -->
    <path d="M252 118 C258 100 280 96 296 108 C308 117 318 132 330 146 C334 151 330 157 323 156 C306 154 286 156 270 156 C256 156 248 136 252 118 Z" fill="#C48A55" stroke="#5A3519" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M256 115 C264 103 282 101 294 110 C285 112 270 116 258 124 Z" fill="#A86E3A" opacity=".75"/>
    <ellipse cx="297" cy="142" rx="7" ry="4" fill="#E88A7A" opacity=".45"/>
    <circle cx="286" cy="126" r="5" fill="#2B1A0E"/>
    <circle cx="287.8" cy="124.2" r="1.6" fill="#FFFFFF"/>
    <ellipse cx="327" cy="150" rx="4" ry="3.2" fill="#2B1A0E"/>
    <path d="M305 152 Q311 155 318 152" fill="none" stroke="#5A3519" stroke-width="2" stroke-linecap="round"/>
