<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-labelledby="titulo">
  <title id="titulo">A jornada de uma consulta: tokenizer, parser, planejador, executor e armazenamento</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B98552"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="408" rx="22" fill="#FFF8EE" stroke="#E9D5B7" stroke-width="2"/>

  <g font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="40" y="52" font-size="26" font-weight="800" fill="#4A2A12">A jornada de uma consulta</text>
    <text x="40" y="80" font-size="16" fill="#8A6A4A">cada etapa é um arquivo da pasta tatu/ — dá para ler tudo numa tarde</text>
  </g>

  <!-- o SQL que entra -->
  <rect x="40" y="100" width="1120" height="46" rx="12" fill="#2B1B10"/>
  <text x="64" y="130" font-family="Consolas,'Cascadia Code','DejaVu Sans Mono',monospace" font-size="18" fill="#FFF1DC"><tspan fill="#FFB86B">SELECT</tspan> apelido, idade <tspan fill="#FFB86B">FROM</tspan> tatus <tspan fill="#FFB86B">WHERE</tspan> idade &gt; <tspan fill="#8FD3D6">3</tspan> <tspan fill="#FFB86B">ORDER BY</tspan> idade;</text>
  <path d="M135 146 V170" stroke="#B98552" stroke-width="3" marker-end="url(#seta)"/>

  <!-- setas entre as etapas -->
  <g stroke="#B98552" stroke-width="3" marker-end="url(#seta)">
    <path d="M234 246 H260"/>
    <path d="M460 246 H486"/>
    <path d="M686 246 H712"/>
    <path d="M912 246 H938"/>
  </g>

  <g font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <!-- 1. tokenizer -->
    <rect x="40" y="176" width="190" height="140" rx="18" fill="#FDE7CF" stroke="#E0A96D" stroke-width="2.5"/>
    <circle cx="66" cy="202" r="15" fill="#E0A96D"/>
    <text x="66" y="208" font-size="16" font-weight="800" fill="#FFFFFF">1</text>
    <g fill="#FFFFFF" stroke="#E0A96D" stroke-width="2.5">
      <rect x="99" y="223" width="20" height="20" rx="6"/>
      <rect x="125" y="223" width="28" height="20" rx="6"/>
      <rect x="159" y="223" width="14" height="20" rx="6"/>
    </g>
    <text x="135" y="276" font-size="19" font-weight="700" fill="#3B2412">Tokenizer</text>
    <text x="135" y="298" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#7A5A3A">tokenizer.py</text>
    <text x="135" y="344" font-size="15" fill="#6B4423">texto → tokens</text>

    <!-- 2. parser -->
    <rect x="266" y="176" width="190" height="140" rx="18" fill="#E5F2D6" stroke="#8DB872" stroke-width="2.5"/>
    <circle cx="292" cy="202" r="15" fill="#8DB872"/>
    <text x="292" y="208" font-size="16" font-weight="800" fill="#FFFFFF">2</text>
    <g stroke="#8DB872" stroke-width="2.5">
      <path d="M361 220 L345 244 M361 220 L377 244" fill="none"/>
      <circle cx="361" cy="218" r="7" fill="#FFFFFF"/>
      <circle cx="345" cy="246" r="7" fill="#FFFFFF"/>
      <circle cx="377" cy="246" r="7" fill="#FFFFFF"/>
    </g>
    <text x="361" y="276" font-size="19" font-weight="700" fill="#3B2412">Parser</text>
    <text x="361" y="298" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#7A5A3A">parser.py</text>
    <text x="361" y="344" font-size="15" fill="#6B4423">tokens → árvore (AST)</text>

    <!-- 3. planejador -->
    <rect x="492" y="176" width="190" height="140" rx="18" fill="#DCEBF5" stroke="#6FA8C7" stroke-width="2.5"/>
    <circle cx="518" cy="202" r="15" fill="#6FA8C7"/>
    <text x="518" y="208" font-size="16" font-weight="800" fill="#FFFFFF">3</text>
    <g stroke="#6FA8C7" stroke-width="2.5">
      <path d="M587 214 V221 M587 231 V238" fill="none"/>
      <rect x="573" y="204" width="28" height="10" rx="4" fill="#FFFFFF"/>
      <rect x="573" y="221" width="28" height="10" rx="4" fill="#FFFFFF"/>
      <rect x="573" y="238" width="28" height="10" rx="4" fill="#FFFFFF"/>
    </g>
    <text x="587" y="276" font-size="19" font-weight="700" fill="#3B2412">Planejador</text>
    <text x="587" y="298" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#7A5A3A">planner.py</text>
    <text x="587" y="344" font-size="15" fill="#6B4423">árvore → plano</text>

    <!-- 4. executor -->
    <rect x="718" y="176" width="190" height="140" rx="18" fill="#ECE0F5" stroke="#A784C2" stroke-width="2.5"/>
    <circle cx="744" cy="202" r="15" fill="#A784C2"/>
    <text x="744" y="208" font-size="16" font-weight="800" fill="#FFFFFF">4</text>
    <circle cx="813" cy="232" r="15" fill="none" stroke="#A784C2" stroke-width="8" stroke-dasharray="6 4.47"/>
    <circle cx="813" cy="232" r="12" fill="#A784C2"/>
    <circle cx="813" cy="232" r="4.5" fill="#FFFFFF"/>
    <text x="813" y="276" font-size="19" font-weight="700" fill="#3B2412">Executor</text>
    <text x="813" y="298" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#7A5A3A">operators.py</text>
    <text x="813" y="344" font-size="15" fill="#6B4423">plano → linhas</text>

    <!-- 5. armazenamento -->
    <rect x="944" y="176" width="216" height="140" rx="18" fill="#F7DEDA" stroke="#D08A80" stroke-width="2.5"/>
    <circle cx="970" cy="202" r="15" fill="#D08A80"/>
    <text x="970" y="208" font-size="16" font-weight="800" fill="#FFFFFF">5</text>
    <g stroke="#D08A80" stroke-width="2.5">
      <path d="M1036 216 V246 A16 5 0 0 0 1068 246 V216" fill="#FFFFFF"/>
      <ellipse cx="1052" cy="216" rx="16" ry="5" fill="#FFFFFF"/>
      <path d="M1036 231 A16 5 0 0 0 1068 231" fill="none"/>
    </g>
    <text x="1052" y="276" font-size="19" font-weight="700" fill="#3B2412">Armazenamento</text>
    <text x="1052" y="298" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#7A5A3A">storage.py</text>
    <text x="1052" y="344" font-size="15" fill="#6B4423">tabelas · índices · diário</text>

    <text x="600" y="386" font-size="14" fill="#8A6A4A">os operadores são geradores Python: cada um puxa linhas do de baixo, até chegar ao armazenamento</text>
  </g>
</svg>
