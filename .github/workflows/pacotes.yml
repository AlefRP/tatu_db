# 📦 Gera todos os pacotes do Tatu DB e testa cada um instalando de verdade.
#
# É um workflow reutilizável: o CI o chama a cada push (os pacotes ficam como
# artefatos da execução) e o Release o chama para publicar uma versão.
#
#   Windows x64         → tatu-windows-x86_64-setup.exe · tatu-windows-x86_64.zip
#   macOS Apple Silicon → tatu-macos-arm64.pkg          · tatu-macos-arm64.tar.gz
#   macOS Intel         → tatu-macos-x86_64.pkg         · tatu-macos-x86_64.tar.gz
#   Linux x64           → tatu-linux-x86_64.deb · .rpm  · tatu-linux-x86_64.tar.gz
#   Linux ARM64         → tatu-linux-arm64.deb  · .rpm  · tatu-linux-arm64.tar.gz
#   Python              → wheel + sdist

name: Pacotes

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch ou tag a empacotar (vazio = o do evento)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch ou tag a empacotar (vazio = main)
        type: string
        default: ""

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  python:
    name: 🐍 wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ferramentas
        run: python -m pip install build twine
      - name: Gera wheel e sdist
        run: python -m build
      - name: Confere os metadados
        run: python -m twine check --strict dist/*
      - name: Instala a wheel num ambiente limpo e testa
        run: |
          python -m venv /tmp/limpo
          /tmp/limpo/bin/pip install dist/*.whl
          /tmp/limpo/bin/tatu -c "SELECT 'wheel ok' AS status"
          test -x /tmp/limpo/bin/toca
      - uses: actions/upload-artifact@v4
        with:
          name: tatu-python
          path: dist/*
          if-no-files-found: error

  binarios:
    name: 📦 ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Linux x64 (.deb · .rpm · .tar.gz)
            os: ubuntu-22.04          # glibc mais antiga = roda em mais distribuições
            artefato: tatu-linux-x86_64
          - nome: Linux ARM64 (.deb · .rpm · .tar.gz)
            os: ubuntu-22.04-arm
            artefato: tatu-linux-arm64
          - nome: macOS Apple Silicon (.pkg · .tar.gz)
            os: macos-latest
            artefato: tatu-macos-arm64
          - nome: macOS Intel (.pkg · .tar.gz)
            os: macos-15-intel
            artefato: tatu-macos-x86_64
          - nome: Windows x64 (setup.exe · .zip)
            os: windows-latest
            artefato: tatu-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instala o PyInstaller
        run: python -m pip install pyinstaller
      - name: Tela virtual e bibliotecas do Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth desktop-file-utils
      - name: Confere o suporte a Tkinter
        run: python -c "import tkinter; print('Tcl/Tk', tkinter.TkVersion)"
      - name: Gera o banco e o cliente gráfico (Linux, com tela virtual)
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/build_binary.py --all
      - name: Gera o banco e o cliente gráfico
        if: runner.os != 'Linux'
        run: python packaging/build_binary.py --all

      - name: Pacote .deb (e testa instalando)
        if: runner.os == 'Linux'
        run: |
          sh packaging/linux/build_deb.sh
          sudo apt-get install -y ./dist/release/*.deb
          tatu -c "SELECT 'deb ok' AS status"
          desktop-file-validate /usr/share/applications/toca.desktop
          xvfb-run -a toca --smoke-test
          sudo apt-get remove -y tatu-db
          test ! -e /usr/bin/toca

      - name: Pacote .rpm (e testa instalando num Fedora)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y rpm
          sh packaging/linux/build_rpm.sh
          docker run --rm -v "$PWD/dist/release:/pacotes:ro" fedora:latest \
            sh -c 'dnf install -y /pacotes/*.rpm && tatu -c "SELECT 6 * 7 AS rpm_ok" &&
              test -x /usr/bin/toca && test -f /usr/share/applications/toca.desktop && rpm -e tatu-db'

      - name: Instalador .pkg (e testa instalando)
        if: runner.os == 'macOS'
        run: |
          sh packaging/macos/build_pkg.sh
          sudo installer -pkg dist/release/*.pkg -target /
          /usr/local/bin/tatu -c "SELECT 'pkg ok' AS status"
          /usr/local/bin/toca --smoke-test
          /Applications/Toca.app/Contents/MacOS/toca --smoke-test
          sudo rm /usr/local/bin/tatu /usr/local/bin/toca
          sudo rm -rf /Applications/Toca.app
          sudo pkgutil --forget io.github.alefrp.tatu-db

      - name: Instalador setup.exe (e testa instalando)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = python -c "import tatu; print(tatu.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" packaging\windows\tatu.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $setup = "dist\release\tatu-windows-x86_64-setup.exe"
          $process = Start-Process $setup -WindowStyle Hidden -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/TASKS=addtopath"
          if ($process.ExitCode -ne 0) { throw "falha ao instalar: $($process.ExitCode)" }
          $installed = "$env:LOCALAPPDATA\Programs\Tatu DB"
          & "$installed\tatu.exe" -c "SELECT 'setup ok' AS status"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $gui = Start-Process "$installed\toca.exe" -WindowStyle Hidden -Wait -PassThru -ArgumentList "--smoke-test"
          if ($gui.ExitCode -ne 0) { throw "o Toca instalado falhou: $($gui.ExitCode)" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if (-not ($userPath -split ";" -contains $installed)) { throw "o instalador não colocou o tatu no PATH" }
          Start-Process "$installed\unins000.exe" -WindowStyle Hidden -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          # o desinstalador se copia para a pasta temporária e continua de lá: espera ele terminar
          foreach ($i in 1..30) {
            if (-not (Test-Path "$installed\tatu.exe") -and -not (Test-Path "$installed\toca.exe")) { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path "$installed\tatu.exe") { throw "a desinstalação deixou o tatu.exe para trás" }
          if (Test-Path "$installed\toca.exe") { throw "a desinstalação deixou o toca.exe para trás" }

      - name: Lista os pacotes
        shell: bash
        run: ls -la dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefato }}
          path: dist/release/*
          if-no-files-found: error
