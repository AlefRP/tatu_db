# 🧪 Integração contínua: roda a cada push e pull request.
#
#   qualidade    → ruff + conferência da documentação (links, âncoras, SVGs)
#   testes       → 88+ testes em Linux, macOS e Windows, do Python 3.10 ao 3.14
#   instaladores → install.sh e install.ps1 de verdade, nos três sistemas
#   pacotes      → executáveis, .deb, .pkg, setup.exe e wheel (ficam como artefatos)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  FORCE_COLOR: "1"

jobs:
  qualidade:
    name: 🧹 Lint e documentação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instala o ruff
        run: python -m pip install ruff
      - name: Ruff
        run: ruff check . --output-format github
      - name: Documentação (links, âncoras, SVGs, contagem de testes)
        run: python scripts/check_docs.py
      - name: Sintaxe dos scripts de shell
        run: |
          sh -n scripts/install.sh
          sh -n packaging/linux/build_deb.sh
          sh -n packaging/macos/build_pkg.sh

  testes:
    name: 🧪 ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Exemplo da API
        run: python examples/primeiros_passos.py
      - name: Shell com -c
        run: python -m tatu -c "SELECT 'tatu' || '-' || 'bola' AS ok"
      - name: Shell lendo um script pelo pipe
        shell: bash
        run: printf '.demo\n.tables\nSELECT COUNT(*) AS tatus FROM tatus;\n' | python -m tatu

  instaladores:
    name: 🛠️ Instalador · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install.sh (cópia local)
        if: runner.os != 'Windows'
        run: |
          sh scripts/install.sh
          ~/.local/bin/tatu -c "SELECT 'instalado!' AS status"
          sh scripts/install.sh --uninstall
          test ! -e ~/.local/bin/tatu

      - name: install.sh (direto do GitHub, como no curl | sh)
        if: runner.os != 'Windows' && github.event_name == 'push'
        run: |
          cat scripts/install.sh | TATU_REF="$GITHUB_SHA" sh
          ~/.local/bin/tatu --version
          sh scripts/install.sh --uninstall

      - name: install.ps1 no PowerShell 7 (cópia local)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1
          & "$env:LOCALAPPDATA\tatu-db\bin\tatu.cmd" -c "SELECT 'instalado!' AS status"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./scripts/install.ps1 -Uninstall
          if (Test-Path "$env:LOCALAPPDATA\tatu-db") { throw "a desinstalação deixou arquivos para trás" }

      - name: install.ps1 no Windows PowerShell 5.1 (direto do GitHub, como no irm | iex)
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: powershell
        run: |
          $env:TATU_REF = $env:GITHUB_SHA
          Get-Content -Raw -Encoding UTF8 scripts/install.ps1 | Invoke-Expression
          & "$env:LOCALAPPDATA\tatu-db\bin\tatu.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & ./scripts/install.ps1 -Uninstall

  pacotes:
    name: 📦 Pacotes
    needs: testes
    uses: ./.github/workflows/pacotes.yml
